name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  WRANGLER_SEND_METRICS: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test in workerd
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null localhost:8787/ping && break; sleep 1; done
          scripts/smoke.sh http://localhost:8787 || { cat wrangler.log; exit 1; }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
